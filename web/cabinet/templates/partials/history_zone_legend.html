{# Легенда подсветки строк «Истории записей» (SPEC.md, §16.2): только жёлтая и
   красная зоны — строки в норме не подсвечиваются. Общая для ЛК и кабинета врача. #}
<ul class="zone-legend history-zone-legend" aria-label="Подсветка строк по зонам давления">

  {% endfor %}
</ul>
