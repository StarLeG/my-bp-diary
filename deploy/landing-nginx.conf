# nginx лендинга (SPEC.md, §16.1, «SEO и скорость»): кеш, gzip, 404.
# Подключается вторым томом контейнера nginx:alpine:
#   -v "<путь>/deploy/landing-nginx.conf:/etc/nginx/conf.d/default.conf:ro"
# Лежит вне web/landing, чтобы не раздаваться как статика.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/javascript image/svg+xml;

    # HTML, robots.txt и sitemap.xml — всегда сверять с сервером: правки видны сразу.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:webp|png|ico|svg|css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }
}
