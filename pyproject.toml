[project]
name = "my-bp-diary"
version = "0.4.3"
description = "Telegram bot for hypertension diary: quick BP tracking, medication reminders, and stats for the doctor."
readme = "README.md"
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "apscheduler>=3,<4",
    "itsdangerous>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.33",
    "cryptography>=42.0",
    "boto3>=1.34",
    "fpdf2>=2.9.0",
    "aiohttp-socks>=0.12.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
]
# Нагрузочные тесты qa/ (SPEC §22): Locust, HTML-отчёт pytest, Playwright.
load = [
    "locust>=2.47.0",
    "pytest-html>=4.1",
    "playwright>=1.45",
]
# E2E QA-стенда (SPEC §22): Telethon + всё для pytest; образ qa/Dockerfile.
qa = [
    "telethon>=1.36",
    {include-group = "dev"},
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["bot"]
branch = true
